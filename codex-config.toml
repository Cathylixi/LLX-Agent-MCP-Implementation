# LLX Agent — Codex client config (employee side)
#
# WHERE THIS GOES on each employee's computer:
#   Windows : C:\Users\<username>\.codex\config.toml
#   Mac/Linux: ~/.codex/config.toml
#
# If they already have a config.toml, just paste the [mcp_servers.llx-skills]
# block below into it. Save, restart Codex, done.
#
# This file holds ONLY the cloud URL — no skill content, no secrets. The skills
# run in the cloud and only results come back.
#
# Codex connects DIRECTLY to the remote streamable-HTTP endpoint via `url` (no
# npx / mcp-remote bridge — that bridge cold-started slowly and dropped the
# handshake). The timeouts give a cold cloud container time to wake up.

[mcp_servers.llx-skills]
url = "https://llx-mcp.delightfuldesert-f5bbaa56.eastus.azurecontainerapps.io/mcp"
startup_timeout_sec = 60
tool_timeout_sec = 120

# --- Windows users only: add these two lines too (top-level, outside any
# [section] — e.g. right above this comment block) ---
#
# Some skills (e.g. crf-annotation) need Codex to run local commands on your
# own machine (reading/writing a PDF). On Windows, Codex's sandbox can
# otherwise silently block this with "CreateProcessAsUserW failed: Access is
# denied" and never even ask you — a known Codex-on-Windows sandbox bug, not
# something wrong with your setup. These two lines make it ask you for
# permission instead of auto-refusing:
#
# approval_policy = "on-request"
# approvals_reviewer = "user"
